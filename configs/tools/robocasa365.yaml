id: robocasa365
name: RoboCasa365
category:
  - embodied_ai
  - manipulation
  - household_tasks
backend:
  engine: MuJoCo
  runtime: Python package and assets
homepage: https://robocasa.ai
summary: Large-scale daily kitchen and household manipulation benchmark environments.
install_level: medium
capabilities:
  visualization: true
  visualization_label: "yes"
  viewer_modes:
    - mujoco_viewer
    - headless_rgb
  tasks:
    - kitchen_manipulation
    - long_horizon_tasks
    - imitation_learning
  sensors:
    - rgb
    - depth
    - robot_state
  robot_types:
    - manipulator
    - mobile_manipulator
  supports_headless: true
  supports_gpu: optional
  large_assets_required: true
requirements:
  python: ">=3.10"
  recommended_python: "3.11"
  os:
    - linux
    - macos
  gpu:
    required: false
    recommended: false
  disk_gb_min: 20
  notes:
    - Large assets and robosuite-compatible dependencies may be required.
    - "Official installation docs: https://robocasa.ai/docs/build/html/introduction/installation.html"
install_profiles:
  minimal:
    manager: documentation
    commands:
      - conda create -c conda-forge -n robocasa python=3.11
      - conda activate robocasa
      - git clone https://github.com/ARISE-Initiative/robosuite
      - cd robosuite && pip install -e .
      - cd .. && git clone https://github.com/robocasa/robocasa
      - cd robocasa && pip install -e .
    notes:
      - Plan only. SimTools does not execute these commands.
      - Official docs currently install robosuite from the master branch.
      - Kitchen assets are a separate opt-in download.
  assets:
    manager: documentation
    commands:
      - python -m robocasa.scripts.setup_macros
      - python -m robocasa.scripts.download_kitchen_assets
    notes:
      - Opt-in only. Official docs note kitchen assets are around 10GB.
      - Confirm asset storage location before running.
commands:
  smoke:
    description: Dry-run RoboCasa365 metadata smoke test.
    command: python -m simtools run robocasa365 --mode smoke --dry-run
  smoke_dry_run:
    description: Show the RoboCasa365 smoke plan without importing robocasa.
    command: python -m simtools run robocasa365 --mode smoke --dry-run
  view:
    description: Print the RoboCasa365 viewer plan.
    command: python -m simtools view robocasa365 --dry-run
adapter:
  module: simtools.adapters.robocasa365
  class_name: RoboCasa365Adapter
  package_checks:
    - robocasa
    - robosuite
readiness:
  stage: planned
  local_environment: not-created
  local_runnable: false
  smoke_verified: false
  visualization_verified: false
  validation_command: python -m simtools run robocasa365 --mode smoke
  viewer_command: python -m robocasa.demos.demo_random_action
  artifact_examples: []
  blockers:
    - RoboCasa365 and robosuite are not installed in a dedicated local environment.
    - Kitchen assets are an explicit download step and are around 10GB in official docs.
    - A no-download smoke and an opt-in MuJoCo viewer adapter must be implemented.
  last_verified: null
  notes:
    - Keep the asset profile separate from the code installation profile.
