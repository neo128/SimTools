id: robocasa365
name: RoboCasa365
category:
  - embodied_ai
  - manipulation
  - household_tasks
backend:
  engine: MuJoCo
  runtime: Python package and assets
homepage: https://robocasa.ai
summary: Large-scale daily kitchen and household manipulation benchmark environments.
install_level: medium
capabilities:
  visualization: true
  visualization_label: "yes"
  viewer_modes:
    - mujoco_viewer
    - headless_rgb
  tasks:
    - kitchen_manipulation
    - long_horizon_tasks
    - imitation_learning
  sensors:
    - rgb
    - depth
    - robot_state
  robot_types:
    - manipulator
    - mobile_manipulator
  supports_headless: true
  supports_gpu: optional
  large_assets_required: true
requirements:
  python: ">=3.10"
  recommended_python: "3.11"
  os:
    - linux
    - macos
  gpu:
    required: false
    recommended: false
  disk_gb_min: 20
  notes:
    - Large assets and robosuite-compatible dependencies may be required.
    - "Official installation docs: https://robocasa.ai/docs/build/html/introduction/installation.html"
install_profiles:
  minimal:
    manager: documentation
    commands:
      - uv venv --python 3.11 .venv-robocasa365
      - git -c http.https://github.com.proxy= -c https.https://github.com.proxy= clone --depth 1 https://github.com/ARISE-Initiative/robosuite.git .simtools/external/robosuite
      - git -c http.https://github.com.proxy= -c https.https://github.com.proxy= clone --depth 1 https://github.com/robocasa/robocasa.git .simtools/external/robocasa
      - uv pip install --python .venv-robocasa365/bin/python -e .simtools/external/robosuite
      - uv pip install --python .venv-robocasa365/bin/python -e .simtools/external/robocasa
      - .venv-robocasa365/bin/python .simtools/external/robosuite/robosuite/scripts/setup_macros.py
      - .venv-robocasa365/bin/python .simtools/external/robocasa/robocasa/scripts/setup_macros.py
    notes:
      - This profile matches the locally verified source checkout path.
      - Official docs currently install robosuite from the master branch.
      - Kitchen assets are a separate opt-in download.
  assets:
    manager: documentation
    commands:
      - printf 'y\n' | .venv-robocasa365/bin/python .simtools/external/robocasa/robocasa/scripts/download_kitchen_assets.py --type all
    notes:
      - Opt-in only. Official docs note kitchen assets are around 10GB.
      - The verified path stores assets in `.simtools/external/robocasa/robocasa/models/assets`.
commands:
  smoke:
    description: Import smoke test for robocasa, robosuite, and mujoco.
    command: python -m simtools run robocasa365 --mode smoke
  smoke_dry_run:
    description: Show the RoboCasa365 smoke plan without importing robocasa.
    command: python -m simtools run robocasa365 --mode smoke --dry-run
  view:
    description: Render one MuJoCo RGB frame from the RoboCasa Kitchen scene.
    command: python -m simtools view robocasa365 --execute --scene Kitchen
adapter:
  module: simtools.adapters.robocasa365
  class_name: RoboCasa365Adapter
  package_checks:
    - robocasa
    - robosuite
readiness:
  stage: real_viewer
  local_environment: .venv-robocasa365
  local_runnable: true
  smoke_verified: true
  visualization_verified: true
  validation_command: python -m simtools run robocasa365 --mode smoke
  viewer_command: python -m simtools view robocasa365 --execute --scene Kitchen --width 640 --height 480
  artifact_examples:
    - .simtools/artifacts/robocasa365/kitchen_rgb.png
  blockers: []
  last_verified: "2026-05-22"
  notes:
    - RoboCasa365 1.0.1, robosuite 1.5.2, and MuJoCo 3.3.1 were verified in `.venv-robocasa365`.
    - The real viewer path uses MuJoCo EGL offscreen rendering and the `Kitchen` scene.
    - Kitchen assets were downloaded through the official asset script into the local checkout.
