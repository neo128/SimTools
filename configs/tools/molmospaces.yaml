id: molmospaces
name: MolmoSpaces
category:
  - embodied_ai
  - manipulation
  - spatial_reasoning
backend:
  engine: MuJoCo
  runtime: Python package and assets
homepage: https://molmo.allenai.org
summary: Embodied spatial reasoning environments associated with Molmo-style tasks.
install_level: medium
capabilities:
  visualization: true
  visualization_label: "yes"
  viewer_modes:
    - mujoco_viewer
    - headless_rgb
  tasks:
    - spatial_reasoning
    - manipulation
    - visual_grounding
  sensors:
    - rgb
    - depth
    - proprioception
  robot_types:
    - manipulator
  supports_headless: true
  supports_gpu: optional
  large_assets_required: true
requirements:
  python: ">=3.10"
  recommended_python: "3.11"
  os:
    - linux
    - macos
  gpu:
    required: false
    recommended: false
  disk_gb_min: 20
  notes:
    - Asset availability and install details should be verified before real integration.
    - "Official code and setup docs: https://github.com/allenai/molmospaces"
install_profiles:
  minimal:
    manager: source
    commands:
      - git clone https://github.com/allenai/molmospaces.git
      - cd molmospaces
      - uv venv --python 3.11 .venv
      - source .venv/bin/activate
      - uv pip install -e ".[mujoco]"
    notes:
      - Plan only. SimTools does not execute these commands.
      - Official docs also support a conda path.
      - Some runs can auto-download assets; choose cache directories first.
  conda:
    manager: conda
    commands:
      - git clone https://github.com/allenai/molmospaces.git
      - cd molmospaces
      - conda create -n mlspaces python=3.11 -y
      - conda activate mlspaces
      - pip install -e ".[mujoco]"
    notes:
      - Use conda or Homebrew Python on macOS if using the MuJoCo debug viewer.
      - The optional Filament renderer and cuRobo paths are intentionally omitted from the base plan.
commands:
  smoke:
    description: Dry-run MolmoSpaces metadata smoke test.
    command: python -m simtools run molmospaces --mode smoke --dry-run
  smoke_dry_run:
    description: Show the MolmoSpaces smoke plan without importing molmo_spaces.
    command: python -m simtools run molmospaces --mode smoke --dry-run
  view:
    description: Print the MolmoSpaces viewer plan.
    command: python -m simtools view molmospaces --dry-run
adapter:
  module: simtools.adapters.molmospaces
  class_name: MolmoSpacesAdapter
  package_checks:
    - molmo_spaces
    - mujoco
readiness:
  stage: planned
  local_environment: not-created
  local_runnable: false
  smoke_verified: false
  visualization_verified: false
  validation_command: python -m simtools run molmospaces --mode smoke
  viewer_command: python scripts/datagen/run_pipeline.py --viewer --seed 3
  artifact_examples: []
  blockers:
    - MolmoSpaces is not installed in a dedicated local checkout/environment.
    - Official debug viewer commands can auto-download assets.
    - SimTools needs explicit cache and artifact policies before real viewer execution.
  last_verified: null
  notes:
    - Prefer validating package imports before running data generation or benchmark jobs.
