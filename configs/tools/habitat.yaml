id: habitat
name: Habitat
category:
  - embodied_ai
  - navigation
  - indoor_interaction
backend:
  engine: Habitat-Sim
  runtime: Python package with native simulator
homepage: https://aihabitat.org
summary: Simulation platform for embodied AI navigation and interaction.
install_level: medium
capabilities:
  visualization: true
  visualization_label: "yes"
  viewer_modes:
    - headless_rgb
    - interactive_viewer
  tasks:
    - point_navigation
    - object_navigation
    - rearrangement
  sensors:
    - rgb
    - depth
    - semantic
  robot_types:
    - mobile_agent
    - articulated_agent
  supports_headless: true
  supports_gpu: recommended
  large_assets_required: optional
requirements:
  python: ">=3.9"
  recommended_python: "3.11"
  os:
    - linux
    - macos
  gpu:
    required: false
    recommended: true
  disk_gb_min: 5
  notes:
    - Dataset assets are task-specific and can be large.
    - "Official quickstart: https://aihabitat.org/docs/habitat-lab/quickstart"
install_profiles:
  minimal:
    manager: pip
    commands:
      - pip install habitat-sim habitat-lab
    notes:
      - Exact package source may depend on OS and CUDA.
      - Prefer the official Habitat install selector for CUDA-specific wheels.
  conda:
    manager: conda
    commands:
      - conda create -p ./.venv-habitat python=3.9 cmake=3.14.0 -y
      - conda install -p ./.venv-habitat habitat-sim withbullet -c conda-forge -c aihabitat -y
      - .venv-habitat/bin/python -m pip install habitat-lab
      - .venv-habitat/bin/python -m pip install pillow==10.4.0
    notes:
      - This profile matches the locally verified Habitat-Sim 0.3.3 path.
      - Habitat-Sim currently uses Python 3.9 in this conda package path, so SimTools launches it through the external profile.
  assets:
    manager: habitat-sim
    commands:
      - conda install -p ./.venv-habitat git-lfs -c conda-forge -y
      - PATH="$PWD/.venv-habitat/bin:$PATH" .venv-habitat/bin/python -m habitat_sim.utils.datasets_download --uids habitat_test_scenes --data-path .simtools/habitat-data --no-replace
      - PATH="$PWD/.venv-habitat/bin:$PATH" git -C .simtools/habitat-data/versioned_data/habitat_test_scenes lfs install --local
      - PATH="$PWD/.venv-habitat/bin:$PATH" git -C .simtools/habitat-data/versioned_data/habitat_test_scenes lfs pull
    notes:
      - Downloads only the official Habitat test scenes into `.simtools/habitat-data`.
      - Full HM3D/ReplicaCAD datasets are intentionally not part of this profile.
  source:
    manager: documentation
    commands:
      - Follow the official Habitat-Sim and Habitat-Lab installation instructions for your OS and CUDA target.
    notes:
      - Use this profile when pip wheels are unavailable or when native builds are required.
      - Download dataset assets only for the task you intend to run.
commands:
  smoke:
    description: Import-only smoke test for habitat and habitat_sim.
    command: python -m simtools run habitat --mode smoke
  smoke_dry_run:
    description: Show the Habitat import-only smoke plan.
    command: python -m simtools run habitat --mode smoke --dry-run
  view:
    description: Render one RGB frame from the official Habitat test scene.
    command: python -m simtools view habitat --execute --scene skokloster-castle
  view_dry_run:
    description: Show the Habitat visual render plan.
    command: python -m simtools view habitat --dry-run
adapter:
  module: simtools.adapters.habitat
  class_name: HabitatAdapter
  package_checks:
    - habitat
    - habitat_sim
readiness:
  stage: real_viewer
  local_environment: .venv-habitat
  local_runnable: true
  smoke_verified: true
  visualization_verified: true
  validation_command: python -m simtools run habitat --mode smoke
  viewer_command: python -m simtools view habitat --execute --scene skokloster-castle --width 640 --height 480
  artifact_examples:
    - .simtools/artifacts/habitat/skokloster-castle_rgb.png
  blockers: []
  last_verified: "2026-05-22"
  notes:
    - Habitat-Sim 0.3.3 and Habitat-Lab 0.3.3 were verified in `.venv-habitat`.
    - SimTools launches the Python 3.9 Habitat profile externally because the base package targets Python 3.11+.
    - Visualization renders one RGB PNG from `habitat_test_scenes/skokloster-castle.glb`.
