id: omnigibson
name: OmniGibson
category:
  - embodied_ai
  - physics
  - household_tasks
backend:
  engine: Isaac Sim / NVIDIA Omniverse
  runtime: Python package with external simulator
homepage: https://behavior.stanford.edu/omnigibson/overview.html
summary: Interactive object-centric simulator for embodied AI household tasks.
install_level: heavy
capabilities:
  visualization: true
  visualization_label: "yes"
  viewer_modes:
    - omniverse_viewer
    - headless_render
  tasks:
    - manipulation
    - household_activity
    - object_state_reasoning
  sensors:
    - rgb
    - depth
    - segmentation
    - physics_state
  robot_types:
    - mobile_manipulator
    - articulated_robot
  supports_headless: partial
  supports_gpu: recommended
  large_assets_required: true
requirements:
  python: ">=3.10"
  recommended_python: "3.10"
  os:
    - linux
  gpu:
    required: false
    recommended: true
  disk_gb_min: 50
  notes:
    - Isaac Sim and Omniverse dependencies are external to the base package.
    - Local package/runtime probing uses .venv-omnigibson.
    - "Official BEHAVIOR setup docs: https://behavior.stanford.edu/getting_started/installation.html"
install_profiles:
  minimal:
    manager: documentation
    commands:
      - git clone -b v3.7.2 https://github.com/StanfordVL/BEHAVIOR-1K.git
      - cd BEHAVIOR-1K
      - ./setup.sh --new-env --omnigibson
      - conda activate behavior
    notes:
      - Plan only. SimTools does not execute these commands.
      - Confirm Isaac Sim, NVIDIA driver, and license requirements first.
      - Add --bddl or --dataset only when you explicitly need BEHAVIOR components.
  source:
    manager: documentation
    commands:
      - git clone https://github.com/StanfordVL/BEHAVIOR-1K.git
      - cd BEHAVIOR-1K
      - ./setup.sh --new-env --omnigibson --bddl
    notes:
      - This source path follows the BEHAVIOR monorepo setup flow.
      - Avoid --dataset until large asset downloads are approved.
commands:
  smoke:
    description: Probe OmniGibson, Isaac Sim, omni, and BDDL package metadata from .venv-omnigibson without launching Isaac or initializing CUDA.
    command: python -m simtools run omnigibson --mode smoke
  smoke_dry_run:
    description: Show the OmniGibson smoke plan without importing omnigibson.
    command: python -m simtools run omnigibson --mode smoke --dry-run
  view:
    description: Start the OmniGibson interactive viewer through the isolated .venv-omnigibson runtime.
    command: python -m simtools view omnigibson --execute
adapter:
  module: simtools.adapters.omnigibson
  class_name: OmniGibsonAdapter
  package_checks:
    - omnigibson
    - isaacsim
    - omni
    - bddl
readiness:
  stage: real_viewer
  local_environment: .venv-omnigibson
  local_runnable: true
  smoke_verified: true
  visualization_verified: true
  validation_command: python -m simtools run omnigibson --mode smoke
  viewer_command: python -m simtools view omnigibson --execute
  artifact_examples:
    - .simtools/artifacts/omnigibson/viewer_launch_proof_20260525.json
  blockers: []
  last_verified: "2026-05-25"
  notes:
    - Do not import Omniverse/Isaac dependencies in base tests.
    - "Verified package metadata: omnigibson 1.1.1, isaacsim 4.1.0.0, bddl 3.5.0."
    - BEHAVIOR Data Bundle EULA was accepted by the user during the interactive 2026-05-25 run.
    - Dataset and assets now exist under .venv-omnigibson/lib/python3.10/site-packages/omnigibson/data.
    - Viewer reached the OmniGibson interactive control loop; SimTools stops verification after timeout once readiness markers appear.
