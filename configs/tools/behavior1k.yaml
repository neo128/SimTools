id: behavior1k
name: BEHAVIOR-1K
category:
  - embodied_ai
  - household_tasks
  - benchmark
backend:
  engine: OmniGibson
  runtime: Dataset and task suite
homepage: https://behavior.stanford.edu
summary: Benchmark suite for household activities and embodied agents.
install_level: heavy
capabilities:
  visualization: true
  visualization_label: "via OmniGibson"
  viewer_modes:
    - omnigibson_viewer
  tasks:
    - household_activity
    - long_horizon_manipulation
    - task_planning
  sensors:
    - rgb
    - depth
    - segmentation
    - state
  robot_types:
    - mobile_manipulator
    - articulated_robot
  supports_headless: partial
  supports_gpu: recommended
  large_assets_required: true
requirements:
  python: ">=3.10"
  recommended_python: "3.10"
  os:
    - linux
  gpu:
    required: false
    recommended: true
  disk_gb_min: 100
  notes:
    - Requires large BEHAVIOR assets and compatible OmniGibson setup.
    - Local package/runtime probing reuses .venv-omnigibson.
    - "Official installation docs: https://behavior.stanford.edu/getting_started/installation.html"
install_profiles:
  minimal:
    manager: documentation
    commands:
      - git clone -b v3.7.2 https://github.com/StanfordVL/BEHAVIOR-1K.git
      - cd BEHAVIOR-1K
      - ./setup.sh --new-env --omnigibson --bddl
      - conda activate behavior
    notes:
      - Plan only. This avoids --dataset by default.
      - Add dataset flags only after accepting the dataset terms and choosing storage.
  source:
    manager: documentation
    commands:
      - git clone -b v3.7.2 https://github.com/StanfordVL/BEHAVIOR-1K.git
      - cd BEHAVIOR-1K
      - ./setup.sh --new-env --omnigibson --bddl --dataset
      - conda activate behavior
    notes:
      - Opt-in only. This may download Isaac Sim and BEHAVIOR datasets.
      - Review EULA and dataset license prompts before running.
  headless:
    manager: documentation
    commands:
      - ./setup.sh --new-env --omnigibson --bddl --dataset --accept-conda-tos --accept-nvidia-eula --accept-dataset-tos
    notes:
      - Use only when license acceptance is deliberate and documented.
commands:
  smoke:
    description: Probe bddl, OmniGibson, and Isaac Sim package metadata from .venv-omnigibson without launching Isaac or initializing CUDA.
    command: python -m simtools run behavior1k --mode smoke
  smoke_dry_run:
    description: Show the BEHAVIOR-1K smoke plan without importing bddl or omnigibson.
    command: python -m simtools run behavior1k --mode smoke --dry-run
  view:
    description: Verify BEHAVIOR-1K visualization through the delegated OmniGibson viewer gate.
    command: python -m simtools view behavior1k --execute
adapter:
  module: simtools.adapters.behavior1k
  class_name: Behavior1KAdapter
  package_checks:
    - bddl
    - omnigibson
    - isaacsim
readiness:
  stage: real_viewer
  local_environment: .venv-omnigibson
  local_runnable: true
  smoke_verified: true
  visualization_verified: true
  validation_command: python -m simtools run behavior1k --mode smoke
  viewer_command: python -m simtools view behavior1k --execute
  artifact_examples:
    - .simtools/artifacts/omnigibson/viewer_launch_proof_20260525.json
  blockers: []
  last_verified: "2026-05-25"
  notes:
    - Package-level metadata is verified through .venv-omnigibson.
    - BEHAVIOR/OmniGibson dataset and assets are installed after user EULA acceptance.
    - BEHAVIOR-1K visualization is delegated to the verified OmniGibson viewer gate.
