[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simtools"
version = "0.1.0"
description = "Local management and comparison platform for embodied AI simulators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SimTools contributors" }]
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[project.scripts]
simtools = "simtools.cli.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
